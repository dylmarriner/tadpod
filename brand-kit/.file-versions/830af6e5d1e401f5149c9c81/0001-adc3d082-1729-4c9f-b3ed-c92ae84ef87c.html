<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="components/app-shell.css">
  <link rel="stylesheet" href="components/sidebar.css">
  <link rel="stylesheet" href="components/data-table.css">
  <link rel="stylesheet" href="components/chat-area.css">
  <link rel="stylesheet" href="components/message-bubble.css">
  <link rel="stylesheet" href="components/input-bar.css">
  <title>TADPODS app shell</title>
  <style>
    body{background:#f7f8fa}.shell{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.sidebar{background:#111111;color:#ffffff;padding:24px;display:grid;align-content:start;gap:24px}.brand{font-weight:700;font-size:20px}.nav{display:grid;gap:8px}.nav a{min-height:44px;padding:10px;color:#ffffff;text-decoration:none;border-radius:8px}.nav a[aria-current=page]{background:#1677ff}.main{min-width:0}.top{height:64px;padding:0 24px;background:#ffffff;border-bottom:1px solid #d9dee7;display:flex;align-items:center;justify-content:space-between}.page{max-width:1200px;margin:0 auto;padding:32px 24px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:#ffffff;border:1px solid #d9dee7;border-radius:8px;padding:20px}.muted{color:#6b7280}@media(max-width:760px){.shell{grid-template-columns:1fr}.sidebar{padding:16px}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}.page{padding:24px 16px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar"><div class="brand">TADPODS</div><nav class="nav" aria-label="Primary navigation"><a href="#" aria-current="page">Dashboard</a><a href="#">Sales</a><a href="#">Purchasing</a><a href="#">Inventory</a><a href="#">Customers</a><a href="#">Administration</a></nav></aside>
    <div class="main"><header class="top"><strong>Dashboard</strong><button style="height:44px;padding:0 16px;border:1px solid #d9dee7;border-radius:8px;background:#ffffff;color:#111111">Search and actions</button></header><main class="page"><p class="muted">Overview</p><h1>Good morning, stay in control.</h1><div class="grid"><section class="card"><div class="muted">Open orders</div><h2>24</h2><p class="muted">Across sales and purchasing</p></section><section class="card"><div class="muted">Inventory alerts</div><h2>7</h2><p class="muted">Review before dispatch</p></section><section class="card"><div class="muted">Outstanding balance</div><h2>$18,420</h2><p class="muted">Due this month</p></section></div></main></div>
  </div>
</body>
</html>
