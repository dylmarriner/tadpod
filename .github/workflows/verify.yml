name: Verify TADPODS

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tadpods
          POSTGRES_USER: tadpods
          POSTGRES_PASSWORD: tadpods-ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tadpods -d tadpods"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      POSTGRES_PASSWORD: tadpods-ci-password
      DATABASE_URL: postgresql://tadpods:tadpods-ci-password@127.0.0.1:5432/tadpods?schema=public
      AUTH_SECRET: tadpods-ci-authentication-secret-value-2026
      CORS_ORIGIN: http://127.0.0.1:3000
      API_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      MINIO_ROOT_USER: tadpods
      MINIO_ROOT_PASSWORD: tadpods-ci-minio-password
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY: tadpods
      S3_SECRET_KEY: tadpods-ci-minio-password
      S3_BUCKET: tadpods-attachments
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      SEED_ADMIN_EMAIL: admin@tadpods.local
      SEED_ADMIN_PASSWORD: ChangeMe-123!
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies and produce lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock-${{ github.sha }}
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 3
      - run: pnpm db:generate
      - run: pnpm --filter @tadpods/database prisma:validate
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm db:seed
      - run: pnpm verify
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Reject unfinished source markers and third-party RELX assets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'TODO|FIXME|RELX|create next app' \
            apps packages README.md docs/development.md docs/deployment.md \
            docs/administrator-guide.md docs/end-user-guide.md; then
            echo 'Unfinished or prohibited source marker found.' >&2
            exit 1
          fi
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
