name: tadpods
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tadpods
      POSTGRES_USER: tadpods
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tadpods -d tadpods"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && mc mb --ignore-existing local/tadpods-attachments"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]

  migrate:
    build: { context: ., target: tools }
    command: ["sh", "-c", "pnpm db:migrate && pnpm db:seed"]
    environment: &app-environment
      NODE_ENV: development
      DATABASE_URL: postgresql://tadpods:${POSTGRES_PASSWORD}@postgres:5432/tadpods?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      CORS_ORIGIN: http://localhost:3000
      API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      S3_BUCKET: tadpods-attachments
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@tadpods.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., target: api }
    environment: *app-environment
    ports: ["4000:4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
      mailpit: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build: { context: ., target: worker }
    environment: *app-environment
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: ., target: web }
    environment: *app-environment
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  minio-data:
